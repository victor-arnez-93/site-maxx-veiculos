<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configurações — Maxx Veículos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../static/css/main.css">
<link rel="stylesheet" href="../static/css/admin.css">
<link rel="stylesheet" href="../static/css/admin/configuracoes.css">
</head>

<body class="admin-page">

<aside class="admin-sidebar">

<a href="../index.html" class="admin-logo">
<img src="../static/img/logo1.png" alt="">
</a>

<nav class="admin-menu">
<a href="admin.html">Estoque</a>
<a href="clientes.html">Clientes</a>
<a href="leads.html">Leads</a>
<a href="propostas.html">Propostas</a>
<a href="financeiro.html">Financeiro</a>
<a href="documentos.html">Documentos</a>
<a href="configuracoes.html" class="active">Configurações</a>

<button id="logoutBtn" type="button">
Sair
</button>
</nav>

</aside>

<main class="admin-main">

<header class="admin-topbar">
<div>
<span class="admin-eyebrow">Sistema</span>
<h1>Configurações da Empresa</h1>
</div>
</header>

<form id="configForm">

<section class="admin-panel">

<div class="admin-panel-head">
<div>
<h2>Dados da Empresa</h2>
<p>Informações utilizadas no site e sistema.</p>
</div>
</div>

<div class="admin-form-grid">

<label>
<span>Nome Fantasia</span>
<input id="nomeFantasia">
</label>

<label>
<span>Razão Social</span>
<input id="razaoSocial">
</label>

<label>
<span>CNPJ</span>
<input id="cnpj">
</label>

<label>
<span>E-mail</span>
<input id="emailEmpresa">
</label>

<label>
<span>Telefone</span>
<input id="telefoneEmpresa">
</label>

<label>
<span>WhatsApp</span>
<input id="whatsappEmpresa">
</label>

</div>

</section>

<section class="admin-panel">

<div class="admin-panel-head">
<div>
<h2>Endereço</h2>
</div>
</div>

<div class="admin-form-grid">

<label>
<span>Endereço</span>
<input id="enderecoEmpresa">
</label>

<label>
<span>Cidade</span>
<input id="cidadeEmpresa">
</label>

<label>
<span>Estado</span>
<input id="estadoEmpresa">
</label>

<label>
<span>CEP</span>
<input id="cepEmpresa">
</label>

</div>

</section>

<section class="admin-panel">

<div class="admin-panel-head">
<div>
<h2>Site e Redes Sociais</h2>
</div>
</div>

<div class="admin-form-grid">

<label>
<span>Instagram</span>
<input id="instagramEmpresa">
</label>

<label>
<span>Facebook</span>
<input id="facebookEmpresa">
</label>

<label>
<span>Horário Atendimento</span>
<input id="horarioEmpresa">
</label>

</div>

<label>
<span>Mensagem padrão WhatsApp</span>
<textarea id="mensagemWhatsapp"></textarea>
</label>

</section>

<section class="admin-panel">

<div class="admin-panel-head">
<div>
<h2>Visual</h2>
</div>
</div>

<div class="admin-form-grid">

<label>
<span>Cor Primária</span>
<input id="corPrimaria" type="color">
</label>

<label>
<span>Cor Secundária</span>
<input id="corSecundaria" type="color">
</label>

<label>
<span>Logo</span>
<input id="logoEmpresa" type="file" accept="image/*">
</label>

</div>

<div class="config-logo-preview">
<img id="logoPreview">
</div>

</section>

<section class="admin-panel">

<div class="admin-checks">

<label>
<input id="sitePublico" type="checkbox">
<span>Site público ativo</span>
</label>

</div>

</section>

<div class="config-actions">

<button
type="submit"
class="admin-btn admin-btn-primary">
Salvar configurações
</button>

</div>

</form>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../static/js/supabase.js"></script>
<script src="../static/js/core/empresa.js"></script>
<script src="../static/js/admin/configuracoes.js"></script>

</body>
</html>
