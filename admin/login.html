<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acesso Restrito — Maxx Veículos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../static/css/main.css">
  <link rel="stylesheet" href="../static/css/login.css">
</head>

<body class="login-page">
  <canvas id="loginParticles" aria-hidden="true"></canvas>

  <main class="login-shell">
    <section class="login-card">
      <span class="login-scanline" aria-hidden="true"></span>

      <a href="../index.html" class="login-logo" aria-label="Voltar para o site Maxx Veículos">
        <img src="../static/img/logo1.png" alt="Maxx Veículos">
      </a>

      <div class="login-head">
        <span class="login-badge">
          <span></span>
          Área restrita
        </span>

        <h1>Painel administrativo</h1>
        <p>Acesso exclusivo para administração do estoque da Maxx Veículos.</p>
      </div>

      <div class="login-alert" id="loginAlert">
        <strong>Erro</strong>
        <span id="loginAlertText">E-mail ou senha incorretos.</span>
      </div>

      <form class="login-form" id="loginForm" autocomplete="off">
        <label class="login-field">
          <span>E-mail</span>
          <input
            type="email"
            id="email"
            placeholder="admin@maxxveiculos.com.br"
            autocomplete="username"
            required
          >
        </label>

        <label class="login-field">
          <span>Senha</span>

          <div class="password-wrap">
            <input
              type="password"
              id="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >

            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar senha">
              👁
            </button>
          </div>
        </label>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="login-btn-text">Entrar no painel</span>
          <span class="login-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <a href="../index.html" class="login-back">
        ← Voltar ao site
      </a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/supabase.js"></script>

  <script src="../static/js/login.js"></script>
</body>
</html>
